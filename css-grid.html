<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width+device-width, initial-scale=1.0" />

    <!-- <title>CSS Grid</title> -->
    <style>
      .el--1 {
        background-color: blueviolet;
      }
      .el--2 {
        background-color: orangered;
        grid-column: 1 / span 4;
        grid-row: 2;
      }
      .el--3 {
        background-color: green;
        height: 150px;
        align-self: end;
        justify-self: center;
      }
      .el--4 {
        background-color: goldenrod;
      }
      .el--5 {
        background-color: palevioletred;
      }
      .el--6 {
        background-color: steelblue;
      }
      .el--7 {
        background-color: yellow;
      }
      .el--8 {
        background-color: crimson;
        grid-column: 2/3;
        grid-row: 1/2;
      }

      .container--1 {
        font-family: sans-serif;
        margin: 40px;
        font-size: 30px;
        background-color: #ddd;

        /* CSS Grid */

        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 1fr 1fr;
        /* height: 500px; */
        /* gap: 20px; */
        column-gap: 40px;
        row-gap: 40px;

        /* 
        - CSS Grid is used to build 2 dimensional layouts 
        - allows uss to write less nestes HTML 
        - Is not meant to replace flexbox but to use in the circumstance where
            you need 2-D
        - It also has column and row axis
        - So grid lines are used to divide a grid container into grid cells 
            whereby gid items live.
        - Grid cells don't necessarily need to be filled.
        - Gutters are spaces btwn grid line and grid cell.
        - Grid container properties:
            grid-template-rows/columns:<track size>
            row/column-gap:0;
            justify(horizontally)/align(vertically)-items:start; 
            justify/align-content:center;
        - Grid items properties:
            grid-column/row: <start/end line>
            justify/align-self:stretch



        */
        /* temp */
        display: none;
      }

      .container--2 {
        font-family: sans-serif;
        background-color: black;
        font-size: 40px;
        margin: 40px;

        width: 700px;
        height: 600px;

        display: grid;
        grid-template-columns: 125px 200px 125px;
        grid-template-rows: 250px 100px;

        /* aligning track inside container
        distribute empty space */

        justify-content: center;
        align-content: center;
        /* align-content: space-between; */
        gap: 50px;

        /* moving items inside the cells */
        align-items: stretch;
        justify-items: center;
      }
    </style>
  </head>
  <body>
    <div class="top-block">
      <!-- <h1>CSS Grid</h1> -->
    </div>
    <div class="container--1">
      <div class="el el--1">HTML</div>
      <div class="el el--2">and</div>
      <div class="el el--3">CSS</div>
      <div class="el el--4">are</div>
      <div class="el el--5">amazing</div>
      <div class="el el--6">languages</div>
      <!-- <div class="el el--7">to</div> -->
      <div class="el el--8">learn</div>
    </div>
    <div>
      <div class="container--2">
        <div class="el el--1">(1)</div>
        <!-- <div class="el el--2">(2)</div> -->
        <div class="el el--3">(3)</div>
        <div class="el el--4">(4)</div>
        <div class="el el--5">(5)</div>
        <div class="el el--6">(6)</div>
        <div class="el el--7">(7)</div>
        /
      </div>
    </div>
  </body>
</html>
