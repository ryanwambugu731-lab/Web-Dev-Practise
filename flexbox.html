<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      .el--1 {
        background-color: blueviolet;
        align-self: flex-start;
      }
      .el--2 {
        background-color: orangered;
      }
      .el--3 {
        background-color: green;
        height: 150px;
      }
      .el--4 {
        background-color: goldenrod;
        align-self: stretch;
      }
      .el--5 {
        background-color: palevioletred;
      }
      .el--6 {
        background-color: steelblue;
      }
      .el--7 {
        background-color: yellow;
      }
      .el--8 {
        background-color: crimson;
      }

      .el {
        /* DEFAULTS 
        flex-grow:0;
        flex-shrink:1;
        flex-basis: auto; 
        flex: 1 0 auto;*/
        flex-grow: 1;
        flex-shrink: 0;
        flex: 1 0 20px;
      }
      .container {
        /* STARTER */
        font-family: sans-serif;
        background-color: #ddd;
        font-size: 34px;
        margin: 40px;

        /* FLEXBOX */
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;

        /*
        -this is used to make the container into a flex container
        - the main axis is the direction that the item are laid out
        - the cross axis is the perpendicular direction in turn
        */
        /*
        -for the align-items: you can also use
          flex-start, flex-end and stretch*/

        /*- justify-content can also use center and space-around
         as an attribute  */

        /*- properties used by a flex container are :

              gap:0(creates space btwn items)
              justify-content:flex-start(align items on main axis )
              align-items:stretch(align item on cross axis)
              flex-direction(define which is main axis)
              flex-wrap(allows item to wrap into a new line if too large)
              align-content(only applies when there are multiple lines)

          - properties used by flex-items are :
              1. align-self:auto(overwrite align items for individual items)
              2. flex-grow:0(to allow an element to grow; 0=no, 1+=yes)
              3.flex-shrink: 1(to allow an element to shrink; 0=no, 1+=yes)
              4. flex-basis:auto (define an item's width, instead of using
                the width property)
              5.flex: 0 1 auto (shorthand for the ones above, i.e. 2,3,4)
              6. order:o (controls order of items; -1 makes them first,
                1 makes it last)


        */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="el el--1">HTML</div>
      <div class="el el--2">and</div>
      <div class="el el--3">CSS</div>
      <div class="el el--4">are</div>
      <div class="el el--5">amazing</div>
      <div class="el el--6">languages</div>
      <div class="el el--7">to</div>
      <div class="el el--8">learn</div>
    </div>
  </body>
</html>
